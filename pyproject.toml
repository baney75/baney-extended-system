[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bes"
version = "1.0.0"
description = "The Baney Extended System: sort files into Do, Keep, Know and Let Go."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[project.scripts]
bes = "bes.cli:main"

[tool.setuptools]
packages = ["bes"]
